# macOS app: a universal NixSCP.app (Apple Silicon and Intel) in a .dmg,
# ad-hoc signed (not notarized yet). Qt from qt.io (universal); OpenSSL and
# libssh built from source for both architectures (cached). The test suite
# runs natively (arm64). Also called by release.yml for version tags.
name: macOS

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [macos]

permissions:
  contents: read

jobs:
  macos:
    name: macOS (universal .dmg)
    runs-on: macos-15
    env:
      QT_VERSION: 6.8.3
      OPENSSL_VERSION: 3.5.9
      OPENSSL_SHA256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
      LIBSSH_VERSION: 0.11.5
      LIBSSH_SHA256: 6898ba9dd836d618b71dc7a4bb786a502c173cef5cafbf20fe5e0567ba4ea30c
      MIN_MACOS: '12.0'
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: |
          brew install ninja pkgconf || true
          echo "DEPS=$HOME/nixscp-deps" >> "$GITHUB_ENV"

      - name: Qt ${{ env.QT_VERSION }} (universal)
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install --quiet aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop "$QT_VERSION" clang_64 -O "$RUNNER_TEMP/qt"
          echo "QT_DIR=$RUNNER_TEMP/qt/$QT_VERSION/macos" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v4
        id: deps
        with:
          path: ~/nixscp-deps
          key: macos-deps-${{ env.OPENSSL_VERSION }}-${{ env.LIBSSH_VERSION }}-${{ env.MIN_MACOS }}-v1

      - name: OpenSSL ${{ env.OPENSSL_VERSION }} and libssh ${{ env.LIBSSH_VERSION }} (arm64 + x86_64)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src" && cd "$RUNNER_TEMP/src"
          curl -fsSL -o openssl.tar.gz "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          curl -fsSL -o libssh.tar.xz "https://www.libssh.org/files/${LIBSSH_VERSION%.*}/libssh-$LIBSSH_VERSION.tar.xz"
          echo "$OPENSSL_SHA256  openssl.tar.gz" | shasum -a 256 -c -
          echo "$LIBSSH_SHA256  libssh.tar.xz" | shasum -a 256 -c -
          # OpenSSL: one build per architecture (same prefix), merged with lipo
          for A in arm64 x86_64; do
            mkdir -p "ossl-$A" && tar xf openssl.tar.gz -C "ossl-$A" --strip-components=1
            (cd "ossl-$A" && ./Configure "darwin64-$A-cc" --prefix="$DEPS" --libdir=lib shared no-tests no-docs \
              "-mmacosx-version-min=$MIN_MACOS" >/dev/null \
              && make -j"$(sysctl -n hw.ncpu)" >/dev/null && make install_sw DESTDIR="$RUNNER_TEMP/stage-$A" >/dev/null)
          done
          mkdir -p "$DEPS"
          cp -R "$RUNNER_TEMP/stage-arm64$DEPS/." "$DEPS/"
          for L in "$DEPS"/lib/libcrypto*.dylib "$DEPS"/lib/libssl*.dylib; do
            [ -L "$L" ] && continue
            lipo -create "$RUNNER_TEMP/stage-arm64$L" "$RUNNER_TEMP/stage-x86_64$L" -output "$L"
          done
          rm -f "$DEPS"/lib/*.a
          lipo -archs "$DEPS"/lib/libcrypto.3.dylib
          # libssh: universal in one build
          tar xf libssh.tar.xz
          cmake -S "libssh-$LIBSSH_VERSION" -B libssh-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET="$MIN_MACOS" \
            -DCMAKE_INSTALL_PREFIX="$DEPS" -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_NAME_DIR="$DEPS/lib" \
            -DOPENSSL_ROOT_DIR="$DEPS" -DOPENSSL_USE_STATIC_LIBS=FALSE \
            -DWITH_EXAMPLES=OFF -DUNIT_TESTING=OFF -DCLIENT_TESTING=OFF -DWITH_GSSAPI=OFF
          cmake --build libssh-build && cmake --install libssh-build
          lipo -archs "$DEPS"/lib/libssh.dylib
          otool -L "$DEPS"/lib/libssh.dylib

      # saved at once, so that a later failing step does not lose it
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: ~/nixscp-deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Tests (arm64)
        continue-on-error: true
        run: |
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          cmake -S . -B builds/test -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET="$MIN_MACOS" -DNIXSCP_BUILD_TESTS=ON
          cmake --build builds/test -- -k 0 || echo "::warning::some tests did not build"
          cd builds/test && ctest -j"$(sysctl -n hw.ncpu)" --timeout 300 --output-on-failure > ctest.log 2>&1 || true
          grep -E 'tests passed|\*\*\*' ctest.log || true
          grep -E "^FAIL|FAIL |^INFO climb" ctest.log | head -80 || true

      - name: App and disk image
        run: packaging/build-macos.sh

      - name: Smoke test
        run: |
          App=bin/macos/NixSCP.app
          "$App/Contents/MacOS/NixSCP" --version
          "$App/Contents/MacOS/nixscp-cli" /help | head -1
          "$App/Contents/MacOS/NixSCP" --help | head -3
          # the Intel slice under Rosetta, when available
          if softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1; then
            arch -x86_64 "$App/Contents/MacOS/NixSCP" --version
            arch -x86_64 "$App/Contents/MacOS/nixscp-cli" /help | head -1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nixscp-macos
          path: bin/macos/*.dmg
          if-no-files-found: error
