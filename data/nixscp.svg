<?xml version="1.0" encoding="UTF-8"?>
<!-- NixSCP application icon. Original artwork for NixSCP (not derived from
     WinSCP's icon set): a dual-panel file manager window with a transfer
     arrow between the panels. Licensed under the same license as NixSCP. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fd8"/>
      <stop offset="1" stop-color="#1c4f9c"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb33b"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ecf8"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#tile)"/>
  <rect x="12" y="12" width="232" height="116" rx="48" fill="#ffffff" opacity="0.08"/>
  <!-- window title bar -->
  <rect x="40" y="46" width="176" height="20" rx="7" fill="#0f2f63" opacity="0.55"/>
  <circle cx="54" cy="56" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="67" cy="56" r="4" fill="#ffffff" opacity="0.6"/>
  <!-- left panel -->
  <rect x="40" y="74" width="80" height="136" rx="10" fill="url(#panel)"/>
  <rect x="50" y="88" width="60" height="9" rx="3" fill="#2f7fd8"/>
  <rect x="50" y="106" width="48" height="7" rx="3" fill="#9db6d8"/>
  <rect x="50" y="121" width="56" height="7" rx="3" fill="#9db6d8"/>
  <rect x="50" y="136" width="40" height="7" rx="3" fill="#9db6d8"/>
  <rect x="50" y="151" width="52" height="7" rx="3" fill="#9db6d8"/>
  <rect x="50" y="166" width="36" height="7" rx="3" fill="#9db6d8"/>
  <!-- right panel -->
  <rect x="136" y="74" width="80" height="136" rx="10" fill="url(#panel)"/>
  <rect x="146" y="88" width="60" height="9" rx="3" fill="#1c4f9c"/>
  <rect x="146" y="106" width="44" height="7" rx="3" fill="#9db6d8"/>
  <rect x="146" y="121" width="56" height="7" rx="3" fill="#9db6d8"/>
  <rect x="146" y="136" width="50" height="7" rx="3" fill="#9db6d8"/>
  <rect x="146" y="151" width="38" height="7" rx="3" fill="#9db6d8"/>
  <rect x="146" y="166" width="54" height="7" rx="3" fill="#9db6d8"/>
  <!-- transfer arrow (double-headed, across both panels) -->
  <g transform="translate(128 192)">
    <rect x="-58" y="-11" width="116" height="22" rx="11" fill="#0f2f63" opacity="0.35" transform="translate(0 4)"/>
    <path d="M -64 0 L -40 -22 L -40 -9 L 40 -9 L 40 -22 L 64 0 L 40 22 L 40 9 L -40 9 L -40 22 Z"
          fill="url(#arrow)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>
